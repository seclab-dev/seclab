<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="10 15 54 54" role="img" aria-label="SecLab logo icon">
  <defs>
    <!-- SDL 核心品牌色：极致纯净的渐变，不带任何模糊滤镜 -->
    <linearGradient id="owl-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C8FF" />
      <stop offset="100%" stop-color="#00D4B4" />
    </linearGradient>
  </defs>

  <!-- 移除所有 filter 包装，回归锐利的矢量线条 -->
  <g>
    <!-- 猫头鹰“眉毛”/天线：加粗线条以获得更好的辨识度 -->
    <path d="M20 36 L28 24 L36 36" fill="none" stroke="url(#owl-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M40 36 L48 24 L56 36" fill="none" stroke="url(#owl-accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- 眼睛：冷静的白灰色描边，瞳孔实心处理，增加神采 -->
    <circle cx="30" cy="46" r="7" fill="none" stroke="#E6EDF7" stroke-width="2.2" />
    <circle cx="46" cy="46" r="7" fill="none" stroke="#E6EDF7" stroke-width="2.2" />
    <circle cx="30" cy="46" r="2.2" fill="#E6EDF7" />
    <circle cx="46" cy="46" r="2.2" fill="#E6EDF7" />
    
    <!-- 喙部：SDL 琥珀金，作为唯一的非冷色调点缀 -->
    <path d="M38 50 L34 56 L42 56 Z" fill="#FFB547" />
  </g>
</svg>
